<!doctype html>
<html lang="en">
<head>
  <meta name="author" content="0dh4m (Adham Cherkaoui Eddeqaqi)">
  <meta name="copyright" content="Copyright (c) 2026 0dh4m (Adham Cherkaoui Eddeqaqi). All rights reserved.">
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
  <title>Sign out · Astron</title><link rel="stylesheet" href="/static/css/dashboard.css">
  <style>
    .logout-page{min-height:100vh;display:grid;place-items:center;padding:24px}.logout-card{width:min(100%,480px);padding:32px}.logout-mark{display:grid;width:46px;height:46px;place-items:center;margin-bottom:25px;border-radius:13px;background:#e8f5f1;color:#337568;font-size:1.25rem}.logout-card h1{margin:0;font:800 2rem/1.12 Manrope,sans-serif;letter-spacing:-.04em}.logout-card p{margin:12px 0 22px;color:var(--text-secondary,#68777b);line-height:1.6}.logout-actions{display:flex;flex-wrap:wrap;gap:10px}.logout-status{min-height:22px;margin-top:14px!important;font-size:.82rem}.logout-card button{cursor:pointer}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
  </style>
</head>
<body class="cyber-theme">
  <div class="ambient-glow orb-cyan"></div><div class="ambient-glow orb-purple"></div>
  <main class="logout-page"><section class="logout-card glass-panel" aria-labelledby="logout-title">
    <div class="logout-mark" aria-hidden="true">↗</div><p class="overview-kicker">ASTRON / SESSION</p><h1 id="logout-title">Sign out</h1>
    <p id="logout-copy">End this browser session and return to the sign-in page.</p>
    <div class="logout-actions"><button class="cyber-btn btn-danger-ghost" id="logout-confirm" type="button">Sign out of Astron</button><a class="cyber-btn btn-ghost" href="/">Back to dashboard</a></div>
    <p class="logout-status" id="logout-status" role="status" aria-live="polite"></p>
  </section></main>
  <script>
    document.getElementById('logout-confirm').addEventListener('click', async (event) => {
      const button = event.currentTarget; button.disabled = true; button.textContent = 'Signing out…';
      const status = document.getElementById('logout-status');
      try {
        const response = await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        if (!response.ok) throw new Error('The session could not be closed. Please try again.');
        document.getElementById('logout-title').textContent = 'You’re signed out';
        document.getElementById('logout-copy').textContent = 'Your Astron session has ended on this browser.';
        button.textContent = 'Signed out';
        status.textContent = 'Taking you to sign-in…';
        window.setTimeout(() => window.location.assign('/login?logged_out=1'), 800);
      } catch (error) { status.textContent = error.message; button.disabled = false; button.textContent = 'Try again'; }
    });
  </script>
</body>
</html>
