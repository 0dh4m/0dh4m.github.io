<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Moroccan Futurism portrait of Adham Cherkaoui Eddeqaqi</title>
  <desc id="archDesc">A dark horseshoe arch filled with zellige geometry, the monogram AC, Rabat coordinates and saffron and Majorelle accents.</desc>

  <defs>
    <linearGradient id="archInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1220"/>
      <stop offset="0.55" stop-color="#070a12"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>

    <linearGradient id="archMaj" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.45" stop-color="#2f5bff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>

    <linearGradient id="archGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8862f"/>
      <stop offset="0.5" stop-color="#f6d98a"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>

    <radialGradient id="archGlow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#2f5bff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#12b5a5" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#070a12" stop-opacity="0"/>
    </radialGradient>

    <pattern id="zellige" width="80" height="80" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#e8b44a" stroke-width="1" opacity="0.22">
        <path d="M40 2 L78 40 L40 78 L2 40 Z"/>
        <path d="M40 18 L52 32 L66 40 L52 48 L40 62 L28 48 L14 40 L28 32 Z"/>
        <circle cx="40" cy="40" r="3" fill="#12b5a5" stroke="none" opacity="0.7"/>
      </g>
      <g fill="none" stroke="#12b5a5" stroke-width="0.7" opacity="0.14">
        <path d="M0 0 L80 80 M80 0 L0 80"/>
      </g>
    </pattern>

    <clipPath id="archClip">
      <path d="M150 730 C150 640 104 572 104 430 C104 244 192 146 300 146 C408 146 496 244 496 430 C496 572 450 640 450 730 Z"/>
    </clipPath>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="760" fill="url(#archGlow)"/>

  <!-- Outer arch -->
  <path d="M150 730 C150 640 104 572 104 430 C104 244 192 146 300 146 C408 146 496 244 496 430 C496 572 450 640 450 730 Z"
        fill="url(#archInk)" stroke="url(#archGold)" stroke-width="2.5"/>

  <!-- Zellige field -->
  <g clip-path="url(#archClip)">
    <rect x="100" y="140" width="400" height="594" fill="url(#zellige)" opacity="0.9"/>
    <path d="M104 430 C104 244 192 146 300 146 C408 146 496 244 496 430 L496 730 L104 730 Z"
          fill="url(#archInk)" opacity="0.62"/>
  </g>

  <!-- Inner arch line -->
  <path d="M176 730 C176 648 132 584 132 438 C132 268 210 178 300 178 C390 178 468 268 468 438 C468 584 424 648 424 730"
        fill="none" stroke="#12b5a5" stroke-width="1.2" opacity="0.55"/>

  <!-- Khatam star -->
  <g transform="translate(300 112)" filter="url(#softGlow)">
    <path d="M0 -34 L10 -10 L34 -34 L10 -10 L34 0 L10 10 L34 34 L10 10 L0 34 L-10 10 L-34 34 L-10 10 L-34 0 L-10 -10 L-34 -34 L-10 -10 Z"
          fill="none" stroke="#e8b44a" stroke-width="1.6"/>
    <circle r="8" fill="none" stroke="#5eead4" stroke-width="1"/>
    <circle r="2.5" fill="#e8b44a"/>
  </g>

  <!-- Monogram -->
  <text x="300" y="420" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="148" font-weight="800" letter-spacing="-8" fill="url(#archMaj)">AC</text>

  <!-- Identity -->
  <text x="300" y="474" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#f3e7cf">ADHAM CHERKAOUI</text>
  <text x="300" y="497" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#f3e7cf">EDDEQAQI</text>

  <line x1="232" y1="530" x2="368" y2="530" stroke="url(#archGold)" stroke-width="1" opacity="0.75"/>

  <text x="300" y="562" text-anchor="middle" font-family="Consolas, monospace" font-size="11" letter-spacing="3" fill="#12b5a5">RABAT · MOROCCO</text>
  <text x="300" y="588" text-anchor="middle" font-family="Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#a9b1c3">34.0209° N · 6.8416° W</text>

  <!-- Base motif -->
  <g transform="translate(300 646)" opacity="0.9">
    <path d="M0 -16 L7 -4 L20 0 L7 4 L0 16 L-7 4 L-20 0 L-7 -4 Z" fill="none" stroke="#e8b44a" stroke-width="1"/>
    <path d="M0 -7 L3 -2 L9 0 L3 2 L0 7 L-3 2 L-9 0 L-3 -2 Z" fill="#12b5a5" opacity="0.8"/>
  </g>

  <text x="300" y="692" text-anchor="middle" font-family="Consolas, monospace" font-size="9" letter-spacing="5" fill="#e8b44a">MOROCCAN FUTURISM</text>

  <!-- Base -->
  <rect x="150" y="730" width="300" height="2" fill="url(#archGold)"/>
  <rect x="196" y="738" width="208" height="1" fill="#12b5a5" opacity="0.5"/>

  <!-- Frame metadata -->
  <text x="24" y="40" font-family="Consolas, monospace" font-size="10" letter-spacing="2" fill="#f3e7cf" opacity="0.45">0DH4M / 01</text>
  <text x="576" y="40" text-anchor="end" font-family="Consolas, monospace" font-size="10" letter-spacing="2" fill="#f3e7cf" opacity="0.45">MA · 2026</text>
  <text x="24" y="734" font-family="Consolas, monospace" font-size="10" letter-spacing="2" fill="#f3e7cf" opacity="0.35">SOFTWARE</text>
  <text x="576" y="734" text-anchor="end" font-family="Consolas, monospace" font-size="10" letter-spacing="2" fill="#f3e7cf" opacity="0.35">SYSTEMS</text>
</svg>
