<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <!-- Secondary Accent -->
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad)" />

  <!-- Cyber Grid Circuit Pattern -->
  <g opacity="0.15" stroke="#00f5ff" stroke-width="1.5">
    <path d="M50 0 V500 M100 0 V500 M150 0 V500 M200 0 V500 M250 0 V500 M300 0 V500 M350 0 V500 M400 0 V500 M450 0 V500" />
    <path d="M0 50 H500 M0 100 H500 M0 150 H500 M0 200 H500 M0 250 H500 M0 300 H500 M0 350 H500 M0 400 H500 M0 450 H500" />
    <!-- Diagonal Accents -->
    <path d="M0 0 L500 500 M500 0 L0 500" stroke="#7928ca" stroke-width="1" />
  </g>

  <!-- Hexagonal Tech Shield Outer Ring -->
  <polygon points="250,35 440,135 440,365 250,465 60,365 60,135" 
           fill="none" stroke="url(#neonCyan)" stroke-width="4" filter="url(#glow)" />
  <polygon points="250,45 430,140 430,360 250,455 70,360 70,140" 
           fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.6" />

  <!-- Corner Tech Nodes -->
  <circle cx="250" cy="35" r="6" fill="#00f5ff" filter="url(#softGlow)" />
  <circle cx="440" cy="135" r="6" fill="#00f5ff" filter="url(#softGlow)" />
  <circle cx="440" cy="365" r="6" fill="#7928ca" filter="url(#softGlow)" />
  <circle cx="250" cy="465" r="6" fill="#ff007a" filter="url(#softGlow)" />
  <circle cx="60" cy="365" r="6" fill="#7928ca" filter="url(#softGlow)" />
  <circle cx="60" cy="135" r="6" fill="#00f5ff" filter="url(#softGlow)" />

  <!-- Inner Concentric Tech Rings -->
  <circle cx="250" cy="235" r="130" fill="#090e1a" stroke="url(#neonPurple)" stroke-width="3" stroke-dasharray="12 6" opacity="0.9" />
  <circle cx="250" cy="235" r="115" fill="#0d1424" stroke="#00f5ff" stroke-width="1.5" opacity="0.4" />

  <!-- Stylized Cyber / Developer Silhouette -->
  <!-- Shoulders & Torso -->
  <path d="M150 380 Q250 330 350 380 L365 440 L135 440 Z" fill="#131c31" stroke="url(#neonCyan)" stroke-width="2" />
  
  <!-- Cyber Jacket / Hoodie collar -->
  <path d="M190 355 L250 385 L310 355 L285 320 L215 320 Z" fill="#1e293b" stroke="#00f5ff" stroke-width="1.5" />

  <!-- Head / Helmet Silhouette -->
  <ellipse cx="250" cy="225" rx="55" ry="65" fill="#0f172a" stroke="url(#neonCyan)" stroke-width="2.5" />
  
  <!-- Sleek Cyber Visor / Glasses -->
  <path d="M205 210 Q250 200 295 210 L290 235 Q250 245 210 235 Z" 
        fill="url(#neonCyan)" filter="url(#glow)" />
  <path d="M210 215 Q250 208 290 215 L286 230 Q250 238 214 230 Z" 
        fill="#ffffff" opacity="0.8" />

  <!-- Glowing Binary / Matrix Accents -->
  <text x="250" y="145" text-anchor="middle" font-family="'Consolas', monospace" font-size="13" font-weight="bold" fill="#00f5ff" letter-spacing="4" opacity="0.8">SYSTEM : ONLINE</text>
  <text x="250" y="420" text-anchor="middle" font-family="'Consolas', monospace" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="6" filter="url(#softGlow)">0DH4M</text>
  <text x="250" y="442" text-anchor="middle" font-family="'Consolas', monospace" font-size="11" font-weight="bold" fill="#00f5ff" letter-spacing="2" opacity="0.9">SOFTWARE &amp; CYBER SECURITY</text>

  <!-- Interactive Terminal Brackets -->
  <text x="180" y="420" text-anchor="middle" font-family="'Consolas', monospace" font-size="24" font-weight="900" fill="#7928ca">&lt;</text>
  <text x="320" y="420" text-anchor="middle" font-family="'Consolas', monospace" font-size="24" font-weight="900" fill="#7928ca">/&gt;</text>
</svg>
